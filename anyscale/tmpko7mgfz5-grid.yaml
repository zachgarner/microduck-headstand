name: microduck-headstand-grid
entrypoint: bash scripts/anyscale/train_multi.sh Mjlab-Headstand-Flat-MicroDuck --env.scene.num-envs 4096 --agent.max_iterations 1000
image_uri: anyscale/ray:2.58.0-py313-cu130
compute_config:
  cloud: aws-public-us-west-2
  head_node:
    instance_type: p5.48xlarge
  worker_nodes: []
excludes: [.git, .venv, logs, wandb, policies, __pycache__, "*.onnx", renders]
env_vars:
  RUN_NAME: headstand-grid-h100
max_retries: 0
timeout_s: 43200
